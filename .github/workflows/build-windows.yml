name: Build Windows (on demand)

# No push/tag trigger on purpose - Windows builds still can't happen on our
# own infrastructure (the Ploi Linux server that builds Linux releases
# can't produce a real .msi at all; WiX only runs on Windows - see
# https://v2.tauri.app/distribute/windows-installer/#build-windows-apps-on-linux-and-macos).
# This only runs when someone clicks "Run workflow", so it costs Actions
# minutes once per release instead of once per push.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install

      # Plain `tauri build`, not tauri-action - nothing here should create a
      # GitHub Release or a git tag, it just needs to produce signed
      # installers for you to grab and copy to launcher.sot.sk yourself.
      # createUpdaterArtifacts (tauri.conf.json) makes this also emit the
      # .sig files next to each installer automatically.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Baked into the binary at compile time via env!() in
          # src-tauri/src/config.rs (see src-tauri/.env.example).
          SOT_API_KEY: ${{ secrets.SOT_API_KEY }}
          SOT_API_BASE_URL: ${{ vars.SOT_API_BASE_URL }}
        run: pnpm tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
