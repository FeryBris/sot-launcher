name: Release

on:
  push:
    tags:
      - 'v*'
    branches: [main]
    paths:
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'package.json'
  workflow_dispatch:

jobs:
  # A plain push to main (even one that bumps the version) can't itself
  # create+push the "app-vX.Y.Z" tag tauri-action publishes under below —
  # a tag pushed by the default GITHUB_TOKEN from inside a workflow run
  # doesn't trigger further workflow runs, so there'd be nothing to kick
  # off the actual build. Checking the version here and gating the real
  # release job on it directly (same run, no re-trigger needed) sidesteps
  # that entirely.
  check-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if git rev-parse "app-v$VERSION" >/dev/null 2>&1; then
            echo "Version $VERSION already has a release tag, skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [check-version]
    if: always() && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || needs.check-version.outputs.should_release == 'true')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # 22.04, not -latest, so the AppImage links against an older
          # glibc and still runs on end-user distros that haven't caught up.
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            curl \
            wget \
            file

      - name: Install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Baked into the binary at compile time via env!() in
          # src-tauri/src/config.rs (see src-tauri/.env.example) — SOT_API_KEY
          # is a secret, SOT_API_BASE_URL isn't, hence the split between
          # secrets./vars. here.
          SOT_API_KEY: ${{ secrets.SOT_API_KEY }}
          SOT_API_BASE_URL: ${{ vars.SOT_API_BASE_URL }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'SoT Launcher v__VERSION__'
          releaseBody: 'See the assets below to download this version.'
          releaseDraft: true
          prerelease: false

      # linuxdeploy freezes libwayland-client/cursor/egl into the AppImage
      # at this Ubuntu version's copy, which goes stale against newer host
      # Mesa builds — confirmed on a Steam Deck: libEGL_mesa.so.0 aborting
      # with "undefined symbol: wl_display_create_queue_with_name" because
      # the bundled libwayland-client predates that symbol. Deleting those
      # three libs from the AppImage forces it to dynamically load the
      # host's own copies instead, which by construction always match that
      # host's Mesa (same fix PCSX2 shipped for the identical bug: see
      # https://github.com/PCSX2/pcsx2/commit/0b12d82). This changes the
      # AppImage's bytes, so its updater .sig (and the .tar.gz wrapper
      # tauri-action already uploaded above) have to be regenerated too.
      - name: Strip bundled Wayland libs from the AppImage and re-sign
        if: matrix.platform == 'ubuntu-22.04'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Must be set to *something*, even empty — the CLI's signer sign
          # subcommand (unlike tauri-action's own build-time signing) falls
          # back to an interactive password prompt when this is unset at
          # all, which has no TTY to read from in CI and fails outright
          # (confirmed locally with a fresh no-password key: "incorrect
          # updater private key password: No such device or address").
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APPIMAGETOOL="$PWD/appimagetool.AppImage"
          curl -Lo "$APPIMAGETOOL" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$APPIMAGETOOL"

          BUNDLE_DIR="src-tauri/target/release/bundle/appimage"
          MATCHES=$(find "$BUNDLE_DIR" -maxdepth 1 -name 'SoTLauncher_*_amd64.AppImage')
          if [ -z "$MATCHES" ] || [ "$(wc -l <<< "$MATCHES")" -ne 1 ]; then
            echo "expected exactly one AppImage, found: $MATCHES" >&2
            exit 1
          fi
          NAME=$(basename "$MATCHES")

          cd "$BUNDLE_DIR"
          chmod +x "$NAME"
          ./"$NAME" --appimage-extract >/dev/null
          rm -f squashfs-root/usr/lib/libwayland-client.so* \
                squashfs-root/usr/lib/libwayland-cursor.so* \
                squashfs-root/usr/lib/libwayland-egl.so*
          rm -f "$NAME"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGETOOL" squashfs-root "$NAME"
          rm -rf squashfs-root

          "$GITHUB_WORKSPACE/node_modules/.bin/tauri" signer sign "$NAME"

          TARBALL="$NAME.tar.gz"
          tar -czf "$TARBALL" "$NAME"
          "$GITHUB_WORKSPACE/node_modules/.bin/tauri" signer sign "$TARBALL"

          VERSION=$(node -p "require('$GITHUB_WORKSPACE/src-tauri/tauri.conf.json').version")
          gh release upload "app-v$VERSION" "$NAME" "$NAME.sig" "$TARBALL" "$TARBALL.sig" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Actual steps live in build-arch.yml, which is also directly dispatchable
  # on its own (no Windows/Linux rebuild) against any existing release.
  build-arch:
    needs: [release]
    # Default success() also checks check-version (release's own need),
    # which is skipped on anything but a main-branch push — and that skip
    # propagates down. release survives it via its own always() below;
    # mirror that here or this job gets skipped right along with it.
    if: always() && needs.release.result == 'success'
    # Reusable-workflow calls get the GITHUB_TOKEN permissions declared on
    # *this* (caller) job, not the ones declared inside build-arch.yml — so
    # this has to be repeated here even though build-arch.yml's own job
    # already asks for it too (that copy covers dispatching it directly).
    permissions:
      contents: write
    uses: ./.github/workflows/build-arch.yml
