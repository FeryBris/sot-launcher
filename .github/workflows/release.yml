name: Release

on:
  push:
    tags:
      - 'v*'
    branches: [main]
    paths:
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'package.json'
  workflow_dispatch:

jobs:
  # A plain push to main (even one that bumps the version) can't itself
  # create+push the "app-vX.Y.Z" tag tauri-action publishes under below —
  # a tag pushed by the default GITHUB_TOKEN from inside a workflow run
  # doesn't trigger further workflow runs, so there'd be nothing to kick
  # off the actual build. Checking the version here and gating the real
  # release job on it directly (same run, no re-trigger needed) sidesteps
  # that entirely.
  check-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if git rev-parse "app-v$VERSION" >/dev/null 2>&1; then
            echo "Version $VERSION already has a release tag, skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [check-version]
    if: always() && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || needs.check-version.outputs.should_release == 'true')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # 22.04, not -latest, so the AppImage links against an older
          # glibc and still runs on end-user distros that haven't caught up.
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            curl \
            wget \
            file

      - name: Install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Baked into the binary at compile time via env!() in
          # src-tauri/src/config.rs (see src-tauri/.env.example) — SOT_API_KEY
          # is a secret, SOT_API_BASE_URL isn't, hence the split between
          # secrets./vars. here.
          SOT_API_KEY: ${{ secrets.SOT_API_KEY }}
          SOT_API_BASE_URL: ${{ vars.SOT_API_BASE_URL }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'SoT Launcher v__VERSION__'
          releaseBody: 'See the assets below to download this version.'
          releaseDraft: true
          prerelease: false

  # Tauri's bundler has no native pacman target, so rather than compiling a
  # second time on Arch we just repackage the .deb the `release` job already
  # built (see packaging/arch/PKGBUILD) — same binary, native package format.
  build-arch:
    needs: [release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # git isn't in the base-devel image (or the base-devel package group),
      # so it has to go in before actions/checkout can do its thing.
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git nodejs github-cli

      - uses: actions/checkout@v5

      - name: Resolve release tag
        id: ver
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download the .deb built for this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.ver.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir packaging/arch

      - name: Build the Arch package
        run: |
          useradd -m builder
          cd packaging/arch
          mv ./*.deb sotlauncher.deb
          sed -i "s/^pkgver=.*/pkgver=${{ steps.ver.outputs.version }}/" PKGBUILD
          chown -R builder:builder .
          su builder -c "makepkg -f --nosign"

      - name: Upload package to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" \
            packaging/arch/*.pkg.tar.zst --repo "$GITHUB_REPOSITORY" --clobber
