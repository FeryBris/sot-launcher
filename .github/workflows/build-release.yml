name: Build Release (on demand)

# No push/tag trigger on purpose - this only runs when someone clicks "Run
# workflow", so it costs Actions minutes once per release instead of once
# per push. macOS isn't in the matrix at all (no Apple hardware in this
# pipeline - dropped from scope, see prior discussion).
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # 22.04, not -latest, so the AppImage links against an older
          # glibc and still runs on end-user distros that haven't caught up.
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            curl \
            wget \
            file \
            rpm

      - name: Install frontend dependencies
        run: pnpm install

      # Plain `tauri build`, not tauri-action - nothing here should create a
      # GitHub Release or a git tag, it just needs to produce signed
      # installers for you to grab and upload through sot.sk's admin panel
      # yourself (Launcher > Releases > pick/create the version > Add
      # Platform Artifact). createUpdaterArtifacts (tauri.conf.json) makes
      # this also emit a .sig next to each platform's designated update
      # target automatically - see the extra signing step below for the
      # Linux files that aren't one of those.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Baked into the binary at compile time via env!() in
          # src-tauri/src/config.rs (see src-tauri/.env.example).
          SOT_API_KEY: ${{ secrets.SOT_API_KEY }}
          SOT_API_BASE_URL: ${{ vars.SOT_API_BASE_URL }}
        run: pnpm tauri build

      # Tauri only auto-signs the one file per platform it considers "the"
      # updater artifact (on Windows, both .msi and .exe qualify and get
      # signed automatically; on Linux only the AppImage's .tar.gz wrapper
      # does). The raw .AppImage/.deb/.rpm are still valid manual downloads
      # for sot.sk's admin panel (see LauncherReleasePlatform::FILE_TYPES in
      # the wotlk repo), they just need their own explicit signature.
      - name: Sign the extra Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Must be set to *something*, even empty - signer sign falls back
          # to an interactive password prompt when this is unset at all,
          # which has no TTY to read from in CI and fails outright.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          pnpm tauri signer sign src-tauri/target/release/bundle/appimage/*.AppImage
          pnpm tauri signer sign src-tauri/target/release/bundle/deb/*.deb
          pnpm tauri signer sign src-tauri/target/release/bundle/rpm/*.rpm

      - name: Upload Windows installers
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

      - name: Upload Linux installers
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
          if-no-files-found: error

  # Tauri's bundler has no native pacman target, so rather than compiling a
  # second time on Arch this repackages the .deb the release job already
  # built (see packaging/arch/PKGBUILD) - same binary, native package
  # format. Not part of sot.sk's updater feed (see
  # LauncherReleasePlatform::FILE_TYPES's linux-pacman entry in the wotlk
  # repo, which never expects a .sig for it) - purely a manual-install
  # convenience for Arch users.
  build-arch:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # git isn't in the base-devel image (or the base-devel package
      # group), and node is needed to read the version out of
      # tauri.conf.json - both have to go in before actions/checkout can
      # do its thing.
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git nodejs

      - uses: actions/checkout@v5

      - name: Download the .deb built by the release job
        uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: packaging/arch

      - name: Build the Arch package
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          useradd -m builder
          cd packaging/arch
          mv ./*.deb sotlauncher.deb
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          chown -R builder:builder .
          # --nodeps: depends=() in the PKGBUILD describes the resulting
          # package's runtime deps for pacman, not build-time requirements -
          # we're repackaging an existing .deb, not compiling, so none of
          # webkit2gtk-4.1/gtk3/libappindicator-gtk3 need to be on this
          # machine, but makepkg checks for them anyway unless told not to.
          su builder -c "makepkg -f --nosign --nodeps"

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: linux-arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
