name: Build Arch Package

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the Arch package to. Leave blank to use the most recent release.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for (e.g. app-v0.1.7). Leave blank to use the most recent release.'
        required: false
        type: string

jobs:
  # Tauri's bundler has no native pacman target, so rather than compiling a
  # second time on Arch this repackages the .deb already attached to an
  # existing GitHub release (see packaging/arch/PKGBUILD) — same binary,
  # native package format. Callable standalone against any past release
  # (no Windows/Linux rebuild needed) or chained after release.yml.
  build-arch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # git isn't in the base-devel image (or the base-devel package group),
      # so it has to go in before actions/checkout can do its thing.
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git nodejs github-cli

      - uses: actions/checkout@v5

      - name: Resolve release tag
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          fi
          if [ -z "$TAG" ]; then
            echo "No release found to build the Arch package against" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#app-v}" >> "$GITHUB_OUTPUT"

      - name: Download the .deb built for that release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.ver.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir packaging/arch --clobber

      - name: Build the Arch package
        run: |
          useradd -m builder
          cd packaging/arch
          mv ./*.deb sotlauncher.deb
          sed -i "s/^pkgver=.*/pkgver=${{ steps.ver.outputs.version }}/" PKGBUILD
          chown -R builder:builder .
          su builder -c "makepkg -f --nosign"

      - name: Upload package to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" \
            packaging/arch/*.pkg.tar.zst --repo "$GITHUB_REPOSITORY" --clobber
